<script>
(function () {
'use strict';

/* ---------- 작은 도구들 ---------- */
const KEY = 'nar-survey-draft-v1';
const app = document.getElementById('app');
const sleep = ms => new Promise(r => setTimeout(r, ms));

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const k in (attrs || {})) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
    else if (k === 'checked' || k === 'value' || k === 'disabled') el[k] = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return el;
}
// 받침 유무에 맞는 조사 고르기. 한글이 아닌 글자(A, B)는 받침 없는 것으로 본다.
function josa(word, withBatchim, without) {
  const c = word.charCodeAt(word.length - 1);
  const has = c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 !== 0;
  return word + (has ? withBatchim : without);
}
function uuid() {
  try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
  const b = new Uint8Array(16);
  try { crypto.getRandomValues(b); } catch (e) { for (let i = 0; i < 16; i++) b[i] = Math.random() * 256 | 0; }
  b[6] = b[6] & 0x0f | 0x40; b[8] = b[8] & 0x3f | 0x80;
  const x = Array.from(b, n => n.toString(16).padStart(2, '0')).join('');
  return x.slice(0, 8) + '-' + x.slice(8, 12) + '-' + x.slice(12, 16) + '-' + x.slice(16, 20) + '-' + x.slice(20);
}

/* ---------- 문항 정의 (명세 4장) ---------- */
const CROWD = CONFIG.CROWD_NAME;
const JUDGE = [
  { v: 'human', t: '실제 사람', d: '안이나 뒤에 사람이 있다' },
  { v: 'ai', t: 'AI', d: '스스로 반응하는 프로그램' },
  { v: 'object', t: '마네킹·물체', d: '반응하지 않는 사물' },
  { v: 'machine', t: '기계', d: '정해진 대로 움직이는 장치' },
  { v: 'unsure', t: '모르겠다' }
];
const YESNO = [{ v: 'yes', t: '예' }, { v: 'no', t: '아니오' }];
const seen = (a, p) => !!a[p + '_exp'] && a[p + '_exp'] !== 'none';
const anySeen = a => seen(a, 'b') || seen(a, 'c') || seen(a, 'a');

function expQ(p, name, tried, help) {
  return { id: p + '_exp', type: 'single', required: true, label: josa(name, '을', '를') + ' 어떻게 경험하셨나요?', help: help,
    opts: [{ v: 'none', t: '안 봄' }, { v: 'seen', t: '보기만 함' }, { v: 'tried', t: tried }] };
}
function scaleQs(p, name) {
  const on = a => seen(a, p);
  return [
    { id: p + '_human', type: 'scale7', label: josa(name, '은', '는') + ' 사람 같았다', cond: on },
    { id: p + '_feel', type: 'scale7', label: josa(name, '은', '는') + ' 무언가를 느끼는 것 같았다', cond: on },
    { id: p + '_think', type: 'scale7', label: josa(name, '은', '는') + ' 스스로 생각하는 것 같았다', cond: on }
  ];
}
function judgeQs(p, name) {
  const on = a => seen(a, p);
  return [
    { id: p + '_what', type: 'single', label: '관람을 마친 지금, ' + josa(name, '은', '는') + ' 무엇이라고 생각하시나요?', opts: JUDGE, cond: on },
    { id: p + '_changed', type: 'single', label: '관람하는 동안 ' + josa(name, '이', '가') + ' 무엇인지에 대한 생각이 바뀌었나요?', opts: YESNO, cond: on },
    { id: p + '_first', type: 'single', label: '처음에는 무엇이라고 생각하셨나요?', opts: JUDGE, cond: a => a[p + '_changed'] === 'yes' }
  ];
}
const quotedYes = a => a.a_quoted === 'yes';
const A_QUOTED = [
  { id: 'a_person', type: 'scale7', label: '그때 A가 하나의 인격을 가진 존재처럼 느껴졌다', cond: quotedYes },
  { id: 'a_other', type: 'scale7', label: '그때 A가 그 말을 했던 다른 관객처럼 느껴졌다', cond: quotedYes }
].filter(q => CONFIG.A_QUOTED_ITEMS.indexOf(q.id) !== -1);

const STEPS = [
  { id: 'b', title: 'B · 4층 복도의 존재', desc: '4층 복도, 의자 위의 존재와 그 앞의 작은 화면',
    qs: [expQ('b', 'B', CONFIG.TRIED_LABEL_B)].concat(scaleQs('b', 'B'), judgeQs('b', 'B')) },
  { id: 'c', title: CROWD + ' · 5층 화면 속 존재들', desc: '5층 벽면 화면 속, 흰 안개 속의 얼굴 없는 군중',
    qs: [expQ('c', CROWD, CONFIG.TRIED_LABEL_C)].concat(scaleQs('c', CROWD), judgeQs('c', CROWD)) },
  { id: 'a', title: 'A · 5층 상자 속 존재', desc: '5층의 흰 나무 상자. 외시경과 손 구멍이 있는 상자 속의 존재',
    qs: [
      expQ('a', 'A', '직접 해 봄', '말 걸기, 만지기, 노크 등'),
      { id: 'a_did', type: 'multi', label: 'A와 무엇을 해 보셨나요?', help: '모두 선택', exclusive: 'na', cond: a => seen(a, 'a'),
        opts: [{ v: 'talk', t: 'A와 대화함' }, { v: 'hand', t: '손 구멍으로 손을 만짐' }, { v: 'peep_door', t: '문 쪽 외시경으로 봄' },
          { v: 'peep_side', t: '측면 외시경으로 봄' }, { v: 'knock', t: '노크함' }, { v: 'na', t: '해당 없음' }] }
    ].concat(scaleQs('a', 'A'), judgeQs('a', 'A'), [
      { id: 'a_reluct', type: 'scale7', label: 'A에게 함부로 말하거나 대하기가 꺼려졌다', cond: a => seen(a, 'a') },
      { id: 'a_quoted', type: 'single', label: 'A가 다른 관객의 말이나 이름을 꺼낸 적이 있나요?', cond: a => seen(a, 'a'),
        opts: [{ v: 'yes', t: '예' }, { v: 'no', t: '아니오' }, { v: 'unsure', t: '모르겠다' }] }
    ], A_QUOTED) },
  { id: 'reflect', title: '세 존재를 돌아보며', show: anySeen,
    qs: [
      { id: 'most_human', type: 'single', label: '가장 사람 같았던 존재는?', cond: anySeen,
        opts: a => [{ v: 'b', t: 'B' }, { v: 'c', t: CROWD }, { v: 'a', t: 'A' }].filter(o => seen(a, o.v)).concat([{ v: 'none', t: '없음' }]) },
      { id: 'most_reason', type: 'multi', label: '그렇게 느낀 이유는?', help: '모두 선택',
        cond: a => ['b', 'c', 'a'].indexOf(a.most_human) !== -1,
        opts: [{ v: 'body', t: '몸의 모양' }, { v: 'voice', t: '목소리' }, { v: 'words', t: '말의 내용이나 말투' }, { v: 'react', t: '내 움직임에 반응함' },
          { v: 'talk', t: '대화가 통함' }, { v: 'memory', t: '나를 기억함' }, { v: 'touch', t: '손의 촉감' }, { v: 'other', t: '기타' }] },
      { id: 'most_reason_other', type: 'text', label: '기타 이유를 적어 주세요', cond: a => (a.most_reason || []).indexOf('other') !== -1 },

    ] },

    ] }

const optsOf = (q, a) => typeof q.opts === 'function' ? q.opts(a) : q.opts;

/* ---------- 상태와 임시 저장 ---------- */
let state, warned, busy, lastError = '';
function fresh() {
  return { id: uuid(), startedAt: 0, savedAt: 0, phase: 'intro', stepId: 'b', consent: null, answers: {} };
}
function save() {
  if (state.phase !== 'intro' && state.phase !== 'survey') return;
  state.savedAt = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}
function clearDraft() { try { localStorage.removeItem(KEY); } catch (e) {} }
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.id && s.answers && typeof s.answers === 'object' && Date.now() - s.savedAt < CONFIG.DRAFT_MAX_AGE_MS &&
        (s.phase === 'intro' || s.phase === 'survey') && STEPS.some(x => x.id === s.stepId)) return s;
  } catch (e) {}
  return null;
}
function reset() {
  clearDraft();
  state = fresh(); warned = new Set(); busy = false;
  document.getElementById('hp').value = '';
  render();
}

// 화면에서 숨겨진 문항의 값을 뺀 "유효한 답". 조건 판단과 전송 모두 이것을 쓴다.
function effective() {
  const src = state.answers, out = {};
  for (const s of STEPS) {
    if (s.show && !s.show(out)) continue;
    for (const q of s.qs) {
      if (q.cond && !q.cond(out)) continue;
      let v = src[q.id];
      if (q.opts) {
        const allowed = optsOf(q, out).map(o => o.v);
        if (Array.isArray(v)) v = v.filter(x => allowed.indexOf(x) !== -1);
        else if (allowed.indexOf(v) === -1) v = undefined;
      }
      if (typeof v === 'string') v = v.trim();
      if (v == null || v === '' || (Array.isArray(v) && !v.length)) continue;
      out[q.id] = v;
    }
  }
  return out;
}
const visibleSteps = E => STEPS.filter(s => !s.show || s.show(E));
const curStep = () => STEPS.find(s => s.id === state.stepId);

/* ---------- 문항 그리기 ---------- */
function setAnswer(q, v) {
  state.answers[q.id] = v;
  save();
  updateVisibility();
}
function renderQ(q, E) {
  const cur = state.answers[q.id];
  const helpEl = q.help ? h('span', { class: 'help' }, q.help) : null;
  if (q.type === 'text' || q.type === 'long') {
    const fid = 'f_' + q.id;
    const field = q.type === 'long'
      ? h('textarea', { id: fid, name: q.id, maxlength: 2000, rows: 3 })
      : h('input', { id: fid, name: q.id, type: 'text', maxlength: 300, autocomplete: 'off' });
    field.value = cur || '';
    field.addEventListener('input', () => { state.answers[q.id] = field.value; save(); });
    return h('div', { class: 'q', 'data-q': q.id }, h('label', { class: 'qlabel', for: fid }, q.label, helpEl), field);
  }
  let body;
  if (q.type === 'scale7') {
    body = [
      h('div', { class: 'scale' }, [1, 2, 3, 4, 5, 6, 7].map(n =>
        h('label', null,
          h('input', { type: 'radio', name: q.id, value: String(n), checked: cur === n,
            'aria-label': n + (n === 1 ? ' 전혀 아니다' : n === 7 ? ' 매우 그렇다' : ''), onchange: () => setAnswer(q, n) }),
          h('span', { 'aria-hidden': 'true' }, n)))),
      h('div', { class: 'ends', 'aria-hidden': 'true' }, h('span', null, '전혀 아니다'), h('span', null, '매우 그렇다'))
    ];
  } else {
    const multi = q.type === 'multi';
    const arr = Array.isArray(cur) ? cur : [];
    body = optsOf(q, E).map(o => h('label', { class: 'opt' },
      h('input', { type: multi ? 'checkbox' : 'radio', name: q.id, value: o.v, checked: multi ? arr.indexOf(o.v) !== -1 : cur === o.v,
        onchange: ev => {
          if (!multi) return setAnswer(q, o.v);
          const boxes = Array.from(ev.target.closest('fieldset').querySelectorAll('input'));
          if (q.exclusive && ev.target.checked) {
            // "해당 없음"을 고르면 나머지 해제, 다른 것을 고르면 "해당 없음" 해제
            boxes.forEach(b => { if ((o.v === q.exclusive) !== (b.value === q.exclusive)) b.checked = false; });
          }
          setAnswer(q, boxes.filter(b => b.checked).map(b => b.value));
        } }),
      h('span', null, o.t, o.d ? h('small', null, o.d) : null)));
  }
  return h('fieldset', { class: 'q', 'data-q': q.id }, h('legend', null, q.label, helpEl), body);
}
function updateVisibility() {
  const E = effective(), step = curStep();
  if (state.phase !== 'survey' || !step) return;
  step.qs.forEach(q => {
    const el = app.querySelector('[data-q="' + q.id + '"]');
    if (el) el.hidden = !!(q.cond && !q.cond(E));
  });
}
function showMsg(kind, ...lines) {
  const m = document.getElementById('msg');
  if (!m) return;
  m.className = 'msg' + (kind ? ' ' + kind : '');
  m.replaceChildren(...lines.filter(Boolean).map(t => h('div', null, t)));
}
function markMissing(ids, soft) {
  app.querySelectorAll('.q').forEach(el => {
    const on = ids.indexOf(el.getAttribute('data-q')) !== -1;
    el.classList.toggle('miss', on);
    el.classList.toggle('soft', on && !!soft);
  });
}
function progress(i, total) {
  return h('div', { class: 'progress', role: 'progressbar', 'aria-valuemin': 1, 'aria-valuemax': total, 'aria-valuenow': i, 'aria-label': '진행 ' + i + '/' + total },
    h('div', { class: 'track' }, h('div', { class: 'bar', style: 'width:' + Math.round(i / total * 100) + '%' })),
    h('span', null, i + ' / ' + total));
}
function mount(nodes, focusHeading) {
  app.replaceChildren(...nodes.flat().filter(Boolean));
  window.scrollTo(0, 0);
  if (focusHeading) { const hd = app.querySelector('h1,h2'); if (hd) { hd.setAttribute('tabindex', '-1'); hd.focus({ preventScroll: true }); } }

function renderStep(focus) {
  const E = effective(), steps = visibleSteps(E);
  let step = curStep();
  if (steps.indexOf(step) === -1) { step = steps[0]; state.stepId = step.id; }
  const i = steps.indexOf(step), last = i === steps.length - 1;
  mount([
    progress(i + 2, steps.length + 1),
    h('h2', null, step.title),
    step.desc ? h('p', { class: 'desc' }, step.desc) : h('p', { class: 'desc' }),
    step.qs.map(q => renderQ(q, E)),
    h('div', { id: 'msg', class: 'msg', role: 'status', 'aria-live': 'polite' }),
    h('div', { class: 'nav' },
      h('button', { type: 'button', class: 'ghost', id: 'prev', onclick: onPrev }, '이전'),
      h('button', { type: 'button', id: 'next', onclick: onNext }, last ? '제출' : '다음'))
  ], focus);
  updateVisibility();
}

function onPrev() {
  if (busy) return;
  const steps = visibleSteps(effective()), i = steps.indexOf(curStep());
  warned = new Set();
  if (i <= 0) state.phase = 'intro'; else state.stepId = steps[i - 1].id;
  save(); render(true);
}

function onNext() {
  if (busy) return;
  const E = effective(), step = curStep();
  const vis = step.qs.filter(q => !q.cond || q.cond(E));
  const missReq = vis.filter(q => q.required && E[q.id] == null).map(q => q.id);
  if (missReq.length) {
    markMissing(missReq);
    showMsg('err', '이 문항은 꼭 답해 주세요.');
    app.querySelector('[data-q="' + missReq[0] + '"]').scrollIntoView({ block: 'center' });
    return;
  }
  // 주관식은 비워도 묻지 않는다. 선택형·척도만 한 번 확인한다.
  const missOpt = vis.filter(q => !q.required && q.type !== 'text' && q.type !== 'long' && E[q.id] == null).map(q => q.id);
  const last = visibleSteps(E).slice(-1)[0] === step;
  if (missOpt.some(id => !warned.has(id))) {
    missOpt.forEach(id => warned.add(id));
    markMissing(missOpt, true);
    showMsg('warn', '답하지 않은 문항이 있어요. 그대로 넘어갈까요?', "'" + (last ? '제출' : '다음') + "'을 한 번 더 누르면 넘어갑니다.");
    return;
  }
  if (last) return submit();
  const steps = visibleSteps(E);
  state.stepId = steps[steps.indexOf(step) + 1].id;
  warned = new Set(); save(); render(true);
}

/* ---------- 전송 (명세 2장 전송 규칙) ---------- */
async function post(payload) {
  if (!CONFIG.ENDPOINT) throw new Error('no_endpoint');
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), CONFIG.TIMEOUT_MS);
  try {
    const res = await fetch(CONFIG.ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload), signal: ctrl.signal });
    const data = JSON.parse(await res.text());
    if (!data || data.ok !== true) throw new Error('server: ' + String(data && data.error || 'not_ok').slice(0, 120));
  } finally { clearTimeout(timer); }
}
async function sendWithRetry(payload, onRetry) {
  const delays = CONFIG.RETRY_DELAYS_MS;
  for (let i = 0; ; i++) {
    try { await post(payload); return true; }
    catch (e) {
      lastError = e && e.message || String(e);
      if (i >= delays.length) return false;
      onRetry(i + 1, delays.length);
      await sleep(delays[i]);
    }
  }
}
function setBusy(on, ids) {
  busy = on;
  ids.forEach(id => { const b = document.getElementById(id); if (b) b.disabled = on; });
}

async function submit() {
  if (busy) return;
  setBusy(true, ['next', 'prev']);
  showMsg('warn', '응답을 보내는 중입니다…');
  const answers = effective();
  answers.duration_sec = Math.max(0, Math.round((Date.now() - (state.startedAt || Date.now())) / 1000));
  const payload = { kind: 'response', response_id: state.id, form_version: CONFIG.FORM_VERSION,
    hp: document.getElementById('hp').value, answers: answers };
  const ok = await sendWithRetry(payload, (n, total) =>
    showMsg('warn', '연결이 불안정해요. 다시 보내는 중입니다… (' + n + '/' + total + ')'));
  if (ok) {
    clearDraft();
    state = fresh(); state.phase = 'done'; busy = false;
    return render(true);
  }
  setBusy(false, ['next', 'prev']);
  const btn = document.getElementById('next');
  if (btn) btn.textContent = '다시 보내기';
  showMsg('err', '응답을 보내지 못했어요. 답안은 그대로 남아 있습니다.', '인터넷 연결을 확인한 뒤 \'다시 보내기\'를 눌러 주세요.', '(오류 정보: ' + lastError + ')');
}

    h('p', { class: 'small' }, '남기지 않고 이 화면을 닫으셔도 됩니다.'),

    h('div', { class: 'q' }, h('label', { class: 'qlabel', for: 'contact' }, '전화번호 또는 이메일'), contact),
    h('div', { class: 'q' },
      h('label', { class: 'opt' }, agree, h('span', null, '개인정보 수집·이용에 동의합니다',
        h('small', null, '수집 항목: 연락처. 목적: 경품 추첨 안내, 인터뷰 연락. 보유 기간: ' + CONFIG.RETENTION + '. 동의하지 않으셔도 되며, 그 경우 추첨과 인터뷰 연락을 받으실 수 없습니다.')))),
    h('div', { id: 'msg', class: 'msg', role: 'status', 'aria-live': 'polite' }),
    h('div', { class: 'nav' }, sendBtn));

  mount([
    h('h1', null, '응답이 제출되었습니다. 감사합니다.'),
    form,
    h('hr'),
    commentary(),
    h('div', { class: 'nav' }, h('button', { type: 'button', class: 'ghost', id: 'restart', onclick: () => { if (!busy) reset(); } }, '새 응답 시작')),
    credit(true)
  ], true);
}

/* ---------- 시작 ---------- */
const T = CONFIG.THEME || {};
for (const k in T) document.documentElement.style.setProperty('--' + k, T[k]);
state = load() || fresh();
warned = new Set(); busy = false;
render();
})();
</script>
</body>
